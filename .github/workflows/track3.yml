name: Track 3 CPU acceptance
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: track3-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
jobs:
  clean-install:
    name: Clean install (${{ matrix.os }}, ${{ matrix.profile }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            profile: base
          - os: ubuntu-24.04
            profile: runtime
          - os: windows-latest
            profile: runtime
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Isolated clone, venv, seed twice, seven roles, model 503 and restart
        run: python scripts/track3/clean_install.py --profile ${{ matrix.profile }} --output "${{ runner.temp }}/track3-install-${{ matrix.profile }}.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: track3-install-${{ matrix.os }}-${{ matrix.profile }}
          path: ${{ runner.temp }}/track3-install-${{ matrix.profile }}.json
          retention-days: 7
  text-and-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CALLWISE_LOCAL_ONLY: 'true'
      TELEGRAM_ENABLED: 'false'
      CALLWISE_CLOUD_INTEGRATIONS_ENABLED: 'false'
      TRACK3_REAL_OLLAMA: '0'
      TRACK3_HTTP_SMOKE: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements-track3-v2-test.txt
      - run: python -m pip check
        id: dependencies
      - name: Meetings, roles, calendar, QA, KPI, gateway, voice routing and release checks
        run: python scripts/track3/check.py -q tests --ignore=tests/ui_track3
      - name: JavaScript syntax and regression tests
        if: always() && steps.dependencies.outcome == 'success'
        run: |
          node --check static/meetings.js
          node --check static/meetings/track3.js
          node --check static/meetings/protocol.js
          node --check static/meetings/voice.js
          node --check static/meetings/administration.js
          node --check static/meetings/crm.js
          node --check static/meetings/calendar.js
          node --check static/meetings/documents.js
          node --test tests/*.cjs static/mts-shell/tests/*.mjs
      - name: Product HTTP, persistence and two roles (no model quality claim)
        if: always() && steps.dependencies.outcome == 'success'
        run: python scripts/track3/http_smoke.py --output /tmp/track3-http.json
      - name: Photoprint v2 roles, KPI and restart over real HTTP
        if: always() && steps.dependencies.outcome == 'success'
        run: python scripts/track3/v2_http_smoke.py --output /tmp/track3-v2-http.json
      - name: V2 evaluator pipeline (scripted double, no live quality claim)
        if: always() && steps.dependencies.outcome == 'success'
        run: python scripts/track3/evaluate.py --dataset photoprint-v2 --scripted-double --output /tmp/track3-v2-evaluation.json
      - name: Python syntax and whitespace
        if: always() && steps.dependencies.outcome == 'success'
        run: |
          python -m compileall -q meetings scripts/track3
          git diff --check cb2614b86f3b83636e670c83a0afb8f4c9d6c3c3 HEAD
      - name: Install test browser (no GPU or voice weights)
        if: always() && steps.dependencies.outcome == 'success'
        id: browser
        timeout-minutes: 5
        run: |
          python - <<'PY_BROWSER'
          from pathlib import Path
          import shutil
          import subprocess
          import sys
          from playwright.sync_api import sync_playwright
          with sync_playwright() as playwright:
              executable = shutil.which('chromium') or playwright.chromium.executable_path
          if Path(executable).is_file():
              print('Using existing Chromium; UI tests must launch it:', executable)
          else:
              subprocess.run([sys.executable, '-m', 'playwright', 'install', 'chromium'], check=True, timeout=240)
          PY_BROWSER
      - name: UI owner's exact browser command
        if: always() && steps.browser.outcome == 'success'
        run: python -m unittest discover -s tests/ui_track3 -p 'test_browser.py' -v
      - name: Browser against real HTTP handlers (explicit model double)
        if: always() && steps.browser.outcome == 'success'
        run: python scripts/track3/ui_http_check.py --output /tmp/track3-ui-http.json --artifacts /tmp/track3-ui-http
      - name: Photoprint v2 role forms and mobile viewports
        if: always() && steps.browser.outcome == 'success'
        run: python scripts/track3/v2_ui_check.py --output /tmp/track3-v2-ui.json --artifacts /tmp/track3-v2-ui
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: track3-cpu-observations
          path: |
            /tmp/track3-http.json
            /tmp/track3-ui-http.json
            /tmp/track3-ui-http/
            /tmp/track3-v2-http.json
            /tmp/track3-v2-evaluation.json
            /tmp/track3-v2-ui.json
            /tmp/track3-v2-ui/
          retention-days: 7
  windows-release:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      PYTHONUTF8: '0'
      TRACK3_REAL_OLLAMA: '0'
      TRACK3_HTTP_SMOKE: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-track3-v2-test.txt
      - run: python -m pip check
      - name: Release, report and gateway checks without UTF-8 locale mode
        run: python scripts/track3/check.py -q tests/test_track3_release__.py tests/test_track3_llm__.py tests/test_track3_install_paths.py
