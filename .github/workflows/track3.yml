name: Track 3 CPU acceptance
on:
  pull_request:
  push:
    branches: [codex/track3-release, codex/track3-integration]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  text-and-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CALLWISE_LOCAL_ONLY: 'true'
      TELEGRAM_ENABLED: 'false'
      CALLWISE_CLOUD_INTEGRATIONS_ENABLED: 'false'
      TRACK3_REAL_OLLAMA: '0'
      TRACK3_HTTP_SMOKE: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements-track3-lock.txt
      - run: python -m pip check
      - name: Install test browser (no GPU or voice weights)
        run: python -m playwright install --with-deps chromium
      - name: Meetings, roles, calendar, QA, KPI, gateway, voice routing and release checks
        run: python scripts/track3/check.py -q tests/test_meetings.py tests/test_meeting_voice.py tests/test_meeting_voice_mode.py tests/test_llm_gateway.py tests/test_track3*.py
      - name: JavaScript syntax and regression tests
        run: |
          node --check static/meetings.js
          node --check static/meetings/track3.js
          node --check static/meetings/protocol.js
          node --test tests/*.cjs
      - name: UI owner's exact browser command
        run: python -m unittest discover -s tests/ui_track3 -p 'test_browser.py' -v
      - name: Product HTTP, persistence and two roles (no model quality claim)
        run: python scripts/track3/http_smoke.py --output /tmp/track3-http.json
      - name: Python syntax and whitespace
        run: |
          python -m compileall -q meetings scripts/track3
          git diff --check ${{ github.event.pull_request.base.sha || github.event.before || 'HEAD' }} HEAD
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: track3-cpu-observations
          path: /tmp/track3-http.json
