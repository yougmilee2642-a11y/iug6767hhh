name: Track 3 CPU acceptance
on:
  pull_request:
  push:
    branches: [codex/track3-integration]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  text-and-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CALLWISE_LOCAL_ONLY: 'true'
      TELEGRAM_ENABLED: 'false'
      CALLWISE_CLOUD_INTEGRATIONS_ENABLED: 'false'
      TRACK3_REAL_OLLAMA: '0'
      TRACK3_HTTP_SMOKE: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements-track3-lock.txt
      - run: python -m pip check
        id: dependencies
      - name: Meetings, roles, calendar, QA, KPI, gateway, voice routing and release checks
        run: python scripts/track3/check.py -q tests/test_meetings.py tests/test_meeting_voice.py tests/test_meeting_voice_mode.py tests/test_llm_gateway.py tests/test_track3*.py
      - name: JavaScript syntax and regression tests
        if: always() && steps.dependencies.outcome == 'success'
        run: |
          node --check static/meetings.js
          node --check static/meetings/track3.js
          node --check static/meetings/protocol.js
          node --test tests/*.cjs
      - name: Product HTTP, persistence and two roles (no model quality claim)
        if: always() && steps.dependencies.outcome == 'success'
        run: python scripts/track3/http_smoke.py --output /tmp/track3-http.json
      - name: Python syntax and whitespace
        if: always() && steps.dependencies.outcome == 'success'
        run: |
          python -m compileall -q meetings scripts/track3
          git diff --check cb2614b86f3b83636e670c83a0afb8f4c9d6c3c3 HEAD
      - name: Install test browser (no GPU or voice weights)
        if: always() && steps.dependencies.outcome == 'success'
        id: browser
        timeout-minutes: 5
        run: python -m playwright install --with-deps chromium
      - name: UI owner's exact browser command
        if: always() && steps.browser.outcome == 'success'
        run: python -m unittest discover -s tests/ui_track3 -p 'test_browser.py' -v
      - name: Browser against real HTTP handlers (explicit model double)
        if: always() && steps.browser.outcome == 'success'
        run: python scripts/track3/ui_http_check.py --output /tmp/track3-ui-http.json --artifacts /tmp/track3-ui-http
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: track3-cpu-observations
          path: |
            /tmp/track3-http.json
            /tmp/track3-ui-http.json
            /tmp/track3-ui-http/
          retention-days: 7
  windows-release:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      PYTHONUTF8: '0'
      TRACK3_REAL_OLLAMA: '0'
      TRACK3_HTTP_SMOKE: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-track3-lock.txt
      - run: python -m pip check
      - name: Release, report and gateway checks without UTF-8 locale mode
        run: python scripts/track3/check.py -q tests/test_track3_release__.py tests/test_track3_llm__.py
